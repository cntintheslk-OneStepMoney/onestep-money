name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Git and PR conventions
        if: github.event_name == 'pull_request'
        run: node scripts/check-git-conventions.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run benchmark:quality

  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - name: Built Pages artifact runtime smoke test
        timeout-minutes: 2
        run: npm run smoke:pages
      - name: Electron desktop startup smoke test
        timeout-minutes: 2
        run: npm run capture
        env:
          FINANCE_CAPTURE_PATH: ${{ runner.temp }}/onestep-money-startup.png
          FINANCE_USER_DATA_PATH: ${{ runner.temp }}/onestep-money-user-data
      - name: Windows packaging smoke test
        timeout-minutes: 15
        run: npm run dist:win -- --publish never
      - name: Packaged Windows native pointer and fullscreen smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'OneStep Money.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Packaged OneStep Money executable was not found under dist.' }
          $env:FINANCE_USER_DATA_PATH = Join-Path '${{ runner.temp }}' 'onestep-money-packaged-user-data'
          $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH = Join-Path '${{ runner.temp }}' 'onestep-money-interaction-diagnostics.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--interaction-smoke' -Wait -PassThru
          if (Test-Path $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH) {
            Get-Content $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

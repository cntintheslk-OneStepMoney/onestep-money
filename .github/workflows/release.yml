name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Git and PR conventions
        if: github.event_name == 'pull_request'
        run: node scripts/check-git-conventions.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint

  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - name: Built Pages artifact runtime smoke test
        timeout-minutes: 2
        run: npm run smoke:pages
      - name: Electron desktop startup smoke test
        timeout-minutes: 2
        run: npm run capture
        env:
          FINANCE_CAPTURE_PATH: ${{ runner.temp }}/onestep-money-startup.png
          FINANCE_USER_DATA_PATH: ${{ runner.temp }}/onestep-money-user-data
      - name: Windows packaging smoke test
        timeout-minutes: 15
        run: npm run dist:win -- --publish never

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

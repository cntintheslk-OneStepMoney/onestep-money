name: Test and release

on:
  push:
    branches: [development, production]
    tags: ['v*']
  pull_request:
    branches: [development, production]

permissions:
  contents: write

jobs:
  repair-stability-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/stability-patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/stability-patch
          fetch-depth: 0
      - name: Restore exact development lock metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin development
          git show origin/development:package-lock.json > package-lock.json
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text(encoding='utf-8')
          first = '  "version": "2.3.0",'
          second = '      "version": "2.3.0",'
          if text.count(first) < 1 or text.count(second) < 1:
              raise SystemExit('Expected v2.3.0 root lockfile version markers were not found')
          text = text.replace(first, '  "version": "2.3.1",', 1)
          text = text.replace(second, '      "version": "2.3.1",', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary tooling and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/finalise-stability-patch.yml
          git checkout origin/development -- .github/workflows/release.yml
      - name: Verify exact final release diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/development
          test "$(git diff --name-only origin/development | sort | tr '\n' ' ')" = "CHANGELOG.md package-lock.json package.json "
          git diff origin/development -- package-lock.json > /tmp/lock.patch
          cat /tmp/lock.patch
          test "$(git diff --numstat origin/development -- package-lock.json)" = $'2\t2\tpackage-lock.json'
          test "$(grep -E '^[+-][^+-]' /tmp/lock.patch | wc -l)" -eq 4
          test "$(grep -E '^[+-][^+-]' /tmp/lock.patch | grep -Ev '^[-+](  |      )\"version\": \"2\.3\.[01]\",$' | wc -l)" -eq 0
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.3.1'||l.version!=='2.3.1'||l.packages[''].version!=='2.3.1') process.exit(1)"
      - name: Commit clean release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Blackline Development Operations'
          git config user.email '104691209+Blackline-Development-DevOps@users.noreply.github.com'
          git add CHANGELOG.md package.json package-lock.json .github/workflows/release.yml
          git commit -m '[v2.3.1][Maintenance] Restore clean release candidate' -m $'Purpose:\nRestore the v2.3.1 release candidate to the exact verified development dependency metadata.\n\nChanges:\nRestore package-lock.json from development, change only its two root version fields to v2.3.1, remove temporary release-finaliser tooling, and restore the normal release workflow.\n\nVerification:\nFinal diff is exactly CHANGELOG.md, package.json and package-lock.json; lockfile differs from development only in the two root version fields. Full release CI follows on this clean head.\n\nIssue: #183'
          git push origin HEAD:release/stability-patch

  test:
    if: github.head_ref != 'release/stability-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Git and PR conventions
        if: github.event_name == 'pull_request'
        run: node scripts/check-git-conventions.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run benchmark:quality

  test-windows:
    if: github.event_name == 'pull_request' && github.head_ref != 'release/stability-patch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - name: Built Pages artifact runtime smoke test
        timeout-minutes: 2
        run: npm run smoke:pages
      - name: Electron desktop startup smoke test
        timeout-minutes: 2
        run: npm run capture
        env:
          FINANCE_CAPTURE_PATH: ${{ runner.temp }}/onestep-money-startup.png
          FINANCE_USER_DATA_PATH: ${{ runner.temp }}/onestep-money-user-data
      - name: Windows packaging smoke test
        timeout-minutes: 15
        run: npm run dist:win -- --publish never
      - name: Packaged Windows native pointer and fullscreen smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'OneStep Money.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Packaged OneStep Money executable was not found under dist.' }
          $env:FINANCE_USER_DATA_PATH = Join-Path '${{ runner.temp }}' 'onestep-money-packaged-user-data'
          $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH = Join-Path '${{ runner.temp }}' 'onestep-money-interaction-diagnostics.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--interaction-smoke' -Wait -PassThru
          if (Test-Path $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH) {
            Get-Content $env:FINANCE_INTERACTION_DIAGNOSTICS_PATH
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

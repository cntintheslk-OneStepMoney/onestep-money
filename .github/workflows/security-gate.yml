name: Security gate
on:
  pull_request:
    branches: [main, development, production]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/reusable-security-gate.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}

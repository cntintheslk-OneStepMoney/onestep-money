name: Reusable Project sync
on:
  workflow_call:
    inputs:
      issue-number: { type: string, required: false, default: "" }
      dry-run: { type: boolean, required: false, default: false }
    secrets:
      project-token: { required: true }
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Reconcile Project
        env:
          DEVOPS_PROJECT_TOKEN: ${{ secrets.project-token }}
          DEVOPS_ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: node scripts/project-sync.mjs ${{ inputs.dry-run && '--dry-run' || '' }}

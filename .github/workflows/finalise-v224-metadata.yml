name: Finalise v2.2.4 metadata

on:
  push:
    branches:
      - fix/windows-native-input-fullscreen

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-native-input-fullscreen
          fetch-depth: 0

      - name: Align v2.2.4 release metadata
        run: node scripts/finalise-v224-metadata.cjs

      - name: Commit metadata and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/finalise-v224-metadata.yml scripts/finalise-v224-metadata.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/finalise-v224-metadata.yml scripts/finalise-v224-metadata.cjs
          git diff --cached --check
          git commit -m "[v2.2.4][Maintenance] Finalise release metadata" -m "Purpose: Finalise #145 release metadata after packaged native pointer and fullscreen verification passed." -m "Changes: Align package and lockfile metadata to v2.2.4, add the consolidated v2.2.4 changelog entry, and remove the temporary branch-only metadata helpers." -m "Verification: PR #150 run #243 passed Linux and Windows tests, project/privacy checks, lint, quality benchmark, Pages smoke, Electron startup, Windows packaging, and the packaged native pointer/wheel/maximize/fullscreen smoke. Full CI will be triggered again after this metadata commit." -m "Issue: #145"
          git push origin HEAD:fix/windows-native-input-fullscreen

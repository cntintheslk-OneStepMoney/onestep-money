name: Apply v2.2.3 delayed interaction patch

on:
  push:
    branches:
      - fix/delayed-click-interception

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delayed-click-interception
          fetch-depth: 0
      - name: Apply focused delayed-interaction source patch
        shell: bash
        run: |
          python3 scripts/apply-v223-delayed-patch.py
          rm scripts/apply-v223-delayed-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html renderer-app.js styles.css preload-bridge.cjs interaction-smoke-main.js tests/interaction-ui.test.js tests/delayed-interaction.test.js scripts/apply-v223-delayed-patch.py
          git commit -m "[v2.2.3][Bug] Prevent delayed click interception" -m "Purpose: Keep delayed packaged update notification state from taking mouse input away from the application." -m "Changes: Remove notification Popover usage and global preload prototype patching, and re-test real Electron clicks after a delayed packaged-style update status event." -m "Verification: Full Linux and Windows PR CI, including delayed Electron mouse-input smoke and Windows packaging." -m "Issue: #145"
          git push origin HEAD:fix/delayed-click-interception

name: Finalise subscriptions lockfile

on:
  push:
    branches: [release/subscriptions]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/subscriptions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -F - <<'EOF'
          [v2.3.0][Maintenance] Synchronise subscriptions lockfile

          Purpose: Synchronise package-lock.json with the frozen v2.3.0 package metadata.
          Changes: Regenerate npm lockfile metadata without changing dependency declarations or running install scripts.
          Verification: Final release CI will validate dependency integrity, package/version consistency and Windows packaging.
          Issue: #133
          EOF
          git push origin HEAD:release/subscriptions

name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-demo-pages.yml'
      - 'demo/**'
      - 'assets/onestep-money-icon.png'
      - 'styles.css'
      - 'date-utils.js'
      - 'finance-core.js'
      - 'financial-reporting.js'
      - 'next-move-priority.js'
      - 'presentation-settings.js'
      - 'review-lifecycle.js'
      - 'scripts/build-pages-site.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build public demo allowlist
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

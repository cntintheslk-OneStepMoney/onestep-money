name: Align v2.2.0 metadata

on:
  push:
    branches: [release/financial-automation]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/financial-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align package metadata
        run: npm version 2.2.0 --no-git-tag-version --allow-same-version
      - name: Commit generated package metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[v2.2.0][Maintenance] Align release metadata"
          git push origin HEAD:release/financial-automation

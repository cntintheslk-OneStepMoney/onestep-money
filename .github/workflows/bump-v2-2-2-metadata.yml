name: Bump v2.2.2 metadata

on:
  push:
    branches:
      - fix/click-interception

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[v2.2.2][Maintenance] Align release metadata') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/click-interception
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align v2.2.2 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = '2.2.2';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          packageLock.version = '2.2.2';
          packageLock.packages[''].version = '2.2.2';
          fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!changelog.includes('## 2.2.2 — Click Interaction Fix')) {
            const marker = '## 2.2.1 — Interaction Hotfix';
            const section = `## 2.2.2 — Click Interaction Fix\n\n### Bug\n- Kept the notification layer out of Chromium's Popover top layer so it cannot intercept application-wide mouse input (#145).\n- Restored reliable physical mouse interaction across sidebar navigation and ordinary Dashboard controls.\n\n### Maintenance\n- Added a Windows Electron interaction smoke using real mouse input, scroll-aware sidebar hit-testing and a renderer-bound Dashboard modal action.\n- Updated application package and lockfile metadata for v2.2.2.\n\n### Data/Migration\n- No stored-data format or migration changes.\n\n### Known Limitations\n- Automated interaction coverage validates core navigation and a representative renderer-bound Dashboard control; final interactive Windows review remains required.\n\n`;
            if (!changelog.includes(marker)) throw new Error('Unable to locate v2.2.1 changelog section.');
            changelog = changelog.replace(marker, `${section}${marker}`);
            fs.writeFileSync(changelogPath, changelog);
          }
          NODE
          rm .github/workflows/bump-v2-2-2-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/bump-v2-2-2-metadata.yml
          git commit -m "[v2.2.2][Maintenance] Align release metadata" \
            -m "Purpose: Align package, lockfile and changelog metadata for the v2.2.2 interaction hotfix." \
            -m "Changes: Set the authoritative package versions to 2.2.2, add consolidated v2.2.2 changelog coverage, and remove the temporary metadata workflow." \
            -m "Verification: Normal PR CI will rerun against the resulting branch." \
            -m "Issue: #145"
          git push origin HEAD:fix/click-interception
